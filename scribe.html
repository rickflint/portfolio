<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scribe's Sanctum — Pieces of Eight</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0a0e1a;
      --navy2: #111827;
      --gold: #c9a84c;
      --gold2: #e8c97a;
      --parchment: #f0e6c8;
      --red: #8b1a1a;
      --muted: #6b7280;
      --border: rgba(201,168,76,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(139,26,26,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.06) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      color: var(--parchment);
      font-family: 'Crimson Text', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .sanctum {
      width: 100%;
      max-width: 640px;
    }

    .crest {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .crest-symbol {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.4));
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(201,168,76,0.3);
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 1rem auto;
      opacity: 0.5;
    }

    .panel {
      background: rgba(17,24,39,0.85);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,168,76,0.1);
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }

    label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      background: rgba(10,14,26,0.8);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--parchment);
      font-family: 'Crimson Text', serif;
      font-size: 1.1rem;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,168,76,0.1);
    }

    textarea {
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #8b6914, var(--gold));
      border: none;
      border-radius: 3px;
      color: var(--navy);
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      padding: 0.8rem;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: 0.8rem;
    }

    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); opacity: 1; }

    .msg {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.7rem 1rem;
      border-radius: 3px;
      margin-bottom: 1rem;
      display: none;
    }

    .msg.success {
      background: rgba(34,85,34,0.3);
      border: 1px solid rgba(100,200,100,0.3);
      color: #90ee90;
      display: block;
    }

    .msg.error {
      background: rgba(139,26,26,0.3);
      border: 1px solid rgba(200,80,80,0.3);
      color: #ffaaaa;
      display: block;
    }

    #login-panel { display: block; }
    #scribe-panel { display: none; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .user-bar span {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .user-bar span strong { color: var(--gold); }

    .signout {
      background: none;
      border: 1px solid rgba(139,26,26,0.5);
      border-radius: 3px;
      color: #cc6666;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.7rem;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .signout:hover { border-color: var(--red); color: #ff9999; }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .back-link a:hover { color: var(--gold); }

    .char-count {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: var(--muted);
      text-align: right;
      margin-top: -1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="sanctum">
  <div class="crest">
    <div class="crest-symbol">⚓</div>
    <h1>Scribe's Sanctum</h1>
    <p class="subtitle">Pieces of Eight — Chronicle Keeper</p>
    <div class="divider"></div>
  </div>

  <!-- LOGIN PANEL -->
  <div class="panel" id="login-panel">
    <p class="panel-title">⚔ Clan Member Access</p>
    <div class="msg" id="login-msg"></div>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your@email.com" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />
    <button class="btn" id="login-btn" onclick="handleLogin()">Enter the Sanctum</button>
  </div>

  <!-- SCRIBE PANEL -->
  <div class="panel" id="scribe-panel">
    <div class="user-bar">
      <span>Logged in as <strong id="user-email"></strong></span>
      <button class="signout" onclick="handleSignout()">Sign Out</button>
    </div>
    <p class="panel-title">📜 Record a Session</p>
    <div class="msg" id="scribe-msg"></div>

    <label for="title">Session Title</label>
    <input type="text" id="title" placeholder="e.g. The Siege of Blackwater Keep" />

    <label for="session-date">Session Date</label>
    <input type="date" id="session-date" />

    <label for="content">Session Log</label>
    <textarea id="content" placeholder="Paste or write the session chronicle here..." oninput="updateCharCount()"></textarea>
    <div class="char-count" id="char-count">0 characters</div>

    <button class="btn" id="submit-btn" onclick="handleSubmit()">Seal the Chronicle</button>
    <button class="btn btn-ghost" onclick="clearForm()">Clear Form</button>
  </div>

  <div class="back-link">
    <a href="dnd.html">← Return to the Fellowship</a>
  </div>
</div>
<!-- // The following script handles authentication and session log submission using Supabase -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://mnrbjkqaqtajdsgyvvqv.supabase.co'
  const SUPABASE_KEY = 'sb_pubLishable_zSw07LGaWPHsqor4qsxEOw_PAALQ3vD'

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  function showMsg(id, text, type) {
    const el = document.getElementById(id)
    el.textContent = text
    el.className = `msg ${type}`
  }

  function showScribePanel(email) {
    document.getElementById('login-panel').style.display = 'none'
    document.getElementById('scribe-panel').style.display = 'block'
    document.getElementById('user-email').textContent = email
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession()
    if (session) showScribePanel(session.user.email)
  }

  // Handle invite callback
  const hash = Object.fromEntries(new URLSearchParams(window.location.hash.slice(1)))

  if (hash.type === 'invite' || hash.type === 'recovery') {
    const { error } = await supabase.auth.setSession({
      access_token: hash.access_token,
      refresh_token: hash.refresh_token
    })
    if (!error) {
      const newPass = prompt('Welcome, Scribe. Set your password to enter the Sanctum:')
      if (newPass) {
        const { error: updateError } = await supabase.auth.updateUser({ password: newPass })
        if (updateError) {
          alert('Error setting password: ' + updateError.message)
        } else {
          const { data: { session } } = await supabase.auth.getSession()
          if (session) showScribePanel(session.user.email)
        }
      }
    }
  } else {
    checkSession()
  }

  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const btn = document.getElementById('login-btn')
    if (!email || !password) {
      showMsg('login-msg', 'Enter your credentials, scribe.', 'error')
      return
    }
    btn.disabled = true
    btn.textContent = 'Authenticating...'
    const { data, error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) {
      showMsg('login-msg', error.message, 'error')
      btn.disabled = false
      btn.textContent = 'Enter the Sanctum'
    } else {
      showScribePanel(data.user.email)
    }
  }

  window.handleSignout = async function() {
    await supabase.auth.signOut()
    document.getElementById('login-panel').style.display = 'block'
    document.getElementById('scribe-panel').style.display = 'none'
    document.getElementById('email').value = ''
    document.getElementById('password').value = ''
  }

  window.handleSubmit = async function() {
    const title = document.getElementById('title').value.trim()
    const session_date = document.getElementById('session-date').value
    const content = document.getElementById('content').value.trim()
    const btn = document.getElementById('submit-btn')
    if (!title || !session_date || !content) {
      showMsg('scribe-msg', 'All fields must be filled before sealing the chronicle.', 'error')
      return
    }
    btn.disabled = true
    btn.textContent = 'Sealing...'
    const { error } = await supabase.from('session_logs').insert([{ title, session_date, content }])
    if (error) {
      showMsg('scribe-msg', error.message, 'error')
    } else {
      showMsg('scribe-msg', 'Chronicle sealed and recorded in the annals.', 'success')
      clearForm()
    }
    btn.disabled = false
    btn.textContent = 'Seal the Chronicle'
  }

  window.clearForm = function() {
    document.getElementById('title').value = ''
    document.getElementById('session-date').value = ''
    document.getElementById('content').value = ''
    document.getElementById('char-count').textContent = '0 characters'
  }

  window.updateCharCount = function() {
    const len = document.getElementById('content').value.length
    document.getElementById('char-count').textContent = `${len.toLocaleString()} characters`
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.handleLogin()
  })
</script>

</body>
</html>
